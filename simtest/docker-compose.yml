name: quilibrium-simtest

# Docker Compose configuration for running 4 Quilibrium archive nodes in an isolated network
# 
# Usage:
#   1. Start the nodes: docker compose up -d --build --remove-orphans
#   2. View logs: docker compose logs -f
#   5. Clean up: docker compose down -v
#
# Environment variables:
#   TARGETARCH: Target architecture (default: arm64)

# TODO disable communication between archives on the network level except via the coordinator
networks:
  quilibrium-isolated:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  # Coordinator node - provides PubSubProxy service for archive nodes
  coordinator:
    build:
      context: ..
      dockerfile: simtest/coordinator/Dockerfile
    image: quilibrium-coordinator:latest
    hostname: coordinator
    command: ["--listen=0.0.0.0:8340", "--network=1"]
    networks:
      quilibrium-isolated:
        ipv4_address: 172.28.0.11
    ports:
      - "8340:8340"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8340"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: 100m

  # Bootstrap node - starts first and provides initial peer discovery
  bootstrap:
    build:
      context: ..
      dockerfile: Dockerfile.source
      args:
        TARGETOS: linux
        TARGETARCH: ${TARGETARCH:-arm64}
    image: quilibrium-simtest:latest
    hostname: bootstrap
    command: ["--dht-only", "--network=1"]
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
      quilibrium-isolated:
        ipv4_address: 172.28.0.10
    environment:
      - QUILIBRIUM_SIGNATURE_CHECK=false
    volumes:
      - ./config/bootstrap-config/:/root/.config
    healthcheck:
      # We can't use p2p-ping here because the bootstrap node is using the pubsub proxy
      test: ["CMD", "p2p-ping", "-timeout", "5s", "/ip4/172.28.0.10/udp/8336/quic-v1/p2p/QmYWRH2ujTmiD1m4jCQaLgUqx72AD31P51pZdtynbHi8Sc"]
      # test: ["CMD", "ps", "-p", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1m
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: 100m

  # Archive nodes
  # These nodes will use the bootstrap node for peer discovery
  # Ideally we would template this to avoid duplication, but getting the index to match the config is tricky
  # https://stackoverflow.com/a/64799824
  archive-1:
    build:
      context: ..
      dockerfile: Dockerfile.source
      args:
        TARGETOS: linux
        TARGETARCH: ${TARGETARCH:-arm64}
    image: quilibrium-simtest:latest
    networks:
      - quilibrium-isolated
    command: ["--network=1", "--signature-check=false", "--config=/root/config"]
    depends_on:
      coordinator:
        condition: service_healthy
      bootstrap:
        condition: service_healthy
    volumes:
       - ./config/archive-1-config:/root/config
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:8337", "list", "quilibrium.node.node.pb.NodeService"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: 100m

  archive-2:
    build:
      context: ..
      dockerfile: Dockerfile.source
      args:
        TARGETOS: linux
        TARGETARCH: ${TARGETARCH:-arm64}
    image: quilibrium-simtest:latest
    networks:
      - quilibrium-isolated
    command: ["--network=1", "--signature-check=false", "--config=/root/config"]
    depends_on:
      coordinator:
        condition: service_healthy
      bootstrap:
        condition: service_healthy
    volumes:
       - ./config/archive-2-config:/root/config
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:8337", "list", "quilibrium.node.node.pb.NodeService"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: 100m

  archive-3:
    build:
      context: ..
      dockerfile: Dockerfile.source
      args:
        TARGETOS: linux
        TARGETARCH: ${TARGETARCH:-arm64}
    image: quilibrium-simtest:latest
    networks:
      - quilibrium-isolated
    command: ["--network=1", "--signature-check=false", "--config=/root/config"]
    depends_on:
      coordinator:
        condition: service_healthy
      bootstrap:
        condition: service_healthy
    volumes:
       - ./config/archive-3-config:/root/config
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:8337", "list", "quilibrium.node.node.pb.NodeService"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: 100m

  archive-4:
    build:
      context: ..
      dockerfile: Dockerfile.source
      args:
        TARGETOS: linux
        TARGETARCH: ${TARGETARCH:-arm64}
    image: quilibrium-simtest:latest
    networks:
      - quilibrium-isolated
    command: ["--network=1", "--signature-check=false", "--config=/root/config"]
    depends_on:
      coordinator:
        condition: service_healthy
      bootstrap:
        condition: service_healthy
    volumes:
       - ./config/archive-4-config:/root/config
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:8337", "list", "quilibrium.node.node.pb.NodeService"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: 100m
